<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="favicon.png" type="image/png">
  <title>书架 · 静读</title>
  <link rel="stylesheet" href="css/style.css">

  <!-- PWA：可安装 + 离线 -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1f1e1c" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="静读">
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <header class="topbar">
    <a class="brand" href="index.html">静读</a>
    <div class="topbar-actions">
      <button id="sync-toggle" class="icon-btn" title="同步阅读进度" aria-label="打开同步阅读进度">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      </button>
      <button id="theme-toggle" class="icon-btn" title="切换深浅色" aria-label="切换深浅色">
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <aside id="sync-panel" class="sync-panel" hidden>
    <div class="sync-head">
      <h2 class="sync-title">同步阅读进度</h2>
    </div>
    <form id="sync-form" class="sync-form">
      <label class="sr-only" for="sync-code">同步码</label>
      <input id="sync-code" class="sync-code" type="text" inputmode="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="输入 4-32 位同步码">
      <div class="sync-actions">
        <button id="sync-save" class="sync-action" type="button">保存</button>
        <button id="sync-restore" class="sync-action" type="button">恢复</button>
      </div>
    </form>
    <p id="sync-status" class="sync-status" aria-live="polite">同一个同步码可在不同设备间保存或恢复阅读进度。</p>
  </aside>

  <main class="shelf" id="main" tabindex="-1">
    <h1 class="shelf-title">书架</h1>
    <p class="shelf-sub" id="shelf-sub">静态书库</p>
    <div class="shelf-controls" id="shelf-controls" hidden>
      <div class="shelf-search-wrap">
        <label class="sr-only" for="shelf-search">搜索书名或作者</label>
        <input id="shelf-search" class="shelf-search" type="search" placeholder="搜索书名或作者…" autocomplete="off" spellcheck="false">
        <button id="shelf-search-clear" class="shelf-search-clear" type="button" aria-label="清除搜索" hidden>✕</button>
      </div>
      <div id="shelf-filters" class="shelf-filters" role="tablist" aria-label="按作者筛选"></div>
    </div>
    <ul id="book-list" class="book-list" aria-live="polite">
      <li class="empty">正在加载书目……</li>
    </ul>
  </main>


  <script src="js/common.js"></script>
  <script src="js/shelf.js"></script>
</body>
</html>
