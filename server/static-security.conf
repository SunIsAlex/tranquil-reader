# 封禁恶意 IP
if ($remote_addr ~ ^(45\.88\.138\.44|178\.16\.54\.137|206\.189\.95\.232|159\.65\.18\.197|64\.89\.161\.85|34\.76\.7\.185|74\.235\.203\.125)$) {
    return 444;
}

# 纯静态站只允许 GET / HEAD；/api/progress 阅读进度同步接口放行全部方法。
# 该例外对其他引入此片段的站点无副作用：它们的扫描拦截规则仍会对 /api/* 返回 444。
set $block_method 1;
if ($request_method ~ ^(GET|HEAD)$) {
    set $block_method 0;
}
if ($uri = /api/progress) {
    set $block_method 0;
}
if ($block_method = 1) {
    return 444;
}

# Let's Encrypt 验证保留
location ^~ /.well-known/acme-challenge/ {
    try_files $uri =404;
}

# 拦截隐藏文件：.env / .git / .ssh 等
location ~* /\.(?!well-known/acme-challenge/) {
    return 444;
}

# 拦截 WordPress / PHP / 管理后台 / API 扫描
location ~* ^/(wp-admin|wp-login\.php|xmlrpc\.php|wordpress|phpmyadmin|pma|_profiler|actuator|server-status|nginx_status|telescope|graphql|api|debug/default/view|console|v2/_catalog)(/|$) {
    return 444;
}

# 纯静态站不应该访问动态脚本
location ~* \.(php|phtml|phar|asp|aspx|jsp|cgi)(/|$) {
    return 444;
}

# 拦截常见泄漏/备份/配置文件
location ~* ^/(composer\.(json|lock)|package(-lock)?\.json|yarn\.lock|config(\.json|\.js|\.env)?|backup|dump|database|id_rsa|aws/credentials|firebase-debug\.log|functions/\.runtimeconfig\.json|.*\.(sql|bak|old|save|swp|zip|tar|tgz|gz|7z|rar))(/|$) {
    return 444;
}
