server {
	listen 443 ssl;
	listen [::]:443 ssl;
	server_name reader.sunisalex.org;

	ssl_certificate /etc/letsencrypt/live/reader.sunisalex.org/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/reader.sunisalex.org/privkey.pem;
	include /etc/letsencrypt/options-ssl-nginx.conf;
	ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

	root /var/www/reader;
	index index.html;

	include /etc/nginx/snippets/static-security.conf;

	# TWA Digital Asset Links（static-security.conf 会拦截隐藏文件，这里单独放行）
	location = /.well-known/assetlinks.json {
		default_type application/json;
		try_files $uri =404;
	}

	# 阅读进度同步 API → 本地 Node 服务（reader-sync.service）
	location = /api/progress {
		proxy_pass http://127.0.0.1:8787;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		client_max_body_size 256k;
		proxy_read_timeout 10s;
	}

	location / {
		try_files $uri $uri/ =404;
	}
}

server {
	listen 80;
	listen [::]:80;
	server_name reader.sunisalex.org;

	# Let's Encrypt 续期验证
	location ^~ /.well-known/acme-challenge/ {
		root /var/www/reader;
		try_files $uri =404;
	}

	location / {
		return 301 https://$host$request_uri;
	}
}
