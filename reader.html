<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="favicon.png" type="image/png">
  <title>阅读 · 静读</title>
  <link rel="stylesheet" href="css/style.css">

  <!-- PWA：可安装 + 离线 -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1f1e1c" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="静读">
</head>
<body class="reading">
  <a class="skip-link" href="#main">跳到主要内容</a>
  <div id="progress-bar" class="progress-bar" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="index.html">‹ 书架</a>
    <span id="book-title" class="topbar-title"></span>
    <div class="topbar-actions">
      <button id="font-dec" class="icon-btn" title="减小字号" aria-label="减小字号">A−</button>
      <button id="font-inc" class="icon-btn" title="增大字号" aria-label="增大字号">A+</button>
      <button id="hl-toggle" class="icon-btn" title="开关词语标注" aria-label="开关词语标注" aria-pressed="true">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
      </button>
      <button id="search-toggle" class="icon-btn" title="全书搜索" aria-label="打开全书搜索">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
      </button>
      <button id="bookmark-toggle" class="icon-btn" title="书签和笔记" aria-label="打开书签和笔记" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
      </button>
      <button id="toc-toggle" class="icon-btn" title="目录" aria-label="打开目录">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 6h2M9 6h12M3 12h2M9 12h12M3 18h2M9 18h12"/></svg>
      </button>
      <button id="theme-toggle" class="icon-btn" title="切换深浅色" aria-label="切换深浅色">
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <aside id="toc" class="toc" hidden>
    <h2 class="toc-title">目录</h2>
    <ol id="toc-list" class="toc-list"></ol>
  </aside>

  <aside id="search-panel" class="search-panel" hidden>
    <div class="search-head">
      <h2 class="search-title">全书搜索</h2>
      <span class="search-shortcut">Ctrl / ⌘ + F</span>
    </div>
    <form id="search-form" class="search-form" role="search">
      <label class="sr-only" for="search-input">搜索当前书籍</label>
      <input id="search-input" class="search-input" type="search" inputmode="search" autocomplete="off" placeholder="搜索人物、地点、概念或原文片段">
      <button id="search-submit" class="search-submit" type="submit">搜索</button>
    </form>
    <p id="search-status" class="search-status" aria-live="polite">输入关键词后，将搜索当前书籍的全部章节。</p>
    <ol id="search-results" class="search-results"></ol>
  </aside>

  <aside id="bookmarks" class="bookmarks-panel" hidden>
    <div class="bookmarks-head">
      <h2 class="bookmarks-title">书签和笔记</h2>
      <button id="bookmark-add" class="bookmark-add" type="button">＋ 当前段落</button>
    </div>
    <ol id="bookmark-list" class="bookmark-list"></ol>
  </aside>

  <main class="reader" id="main" tabindex="-1">
    <h1 id="chapter-title" class="chapter-title"></h1>
    <article id="chapter-body" class="chapter-body">
      <p class="empty">正在加载……</p>
    </article>

    <nav class="chapter-nav">
      <button id="prev-btn" class="nav-btn">‹ 上一章</button>
      <button id="next-btn" class="nav-btn">下一章 ›</button>
    </nav>
  </main>

  <script src="js/common.js"></script>
  <script src="js/reader.js"></script>
</body>
</html>
